<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Chat BIBIP mode vocal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF;text-decoration:none}a:hover{color:#EC7A45}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #202527; font-family: 'Inter', sans-serif; color: #FFFFFF; box-sizing: border-box; padding: 54px 20px 34px 20px; display: flex; flex-direction: column; align-items: center; overflow: hidden">

<div style="width: 100%; display: flex; align-items: center; justify-content: space-between">
<a href="Conversation.dc.html" aria-label="Fermer le mode vocal" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #40484B; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
</a>
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.16em; color: #B4BABC">MODE VOCAL</span>
<button aria-label="Langue : darija, détectée automatiquement" style="height: 36px; border-radius: 18px; border: 1px solid #40484B; background: #2A3033; color: #FFFFFF; font-size: 12px; font-weight: 600; padding: 0 12px; display: flex; align-items: center; gap: 6px">
<span style="width: 6px; height: 6px; border-radius: 3px; background: #4CC38A"></span>Darija · auto
</button>
</div>

<div style="margin-top: 40px; width: 260px; height: 260px; border-radius: 130px; border: 1px solid #343B3E; display: flex; align-items: center; justify-content: center">
<div style="width: 204px; height: 204px; border-radius: 102px; border: 1px solid #40484B; display: flex; align-items: center; justify-content: center">
<div style="width: 152px; height: 152px; border-radius: 76px; background: #3A2A22; border: 2px solid {{accent}}; display: flex; align-items: center; justify-content: center">
<div style="width: 104px; height: 104px; border-radius: 52px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Micro actif"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><line x1="12" y1="18" x2="12" y2="21"></line></svg>
</div>
</div>
</div>
</div>

<div style="margin-top: 26px; display: flex; align-items: center; gap: 3px; height: 34px">
<sc-for list="{{wave}}" as="w" hint-placeholder-count="30">
<span style="{{w.style}}"></span>
</sc-for>
</div>

<div style="margin-top: 18px; display: flex; flex-direction: column; align-items: center; gap: 4px">
<span style="font-family: 'Montserrat', sans-serif; font-size: 24px; font-weight: 600">J'écoute…</span>
<span style="font-size: 14px; color: #B4BABC">0:04</span>
</div>

<div style="margin-top: 22px; width: 100%; box-sizing: border-box; background: #2A3033; border: 1px solid #343B3E; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 10px; font-weight: 600; letter-spacing: 0.16em; color: #B4BABC">TRANSCRIPTION EN DIRECT</span>
<span style="font-size: 18px; font-weight: 500; line-height: 1.45; color: #FFFFFF">Ou chkoun li ma rje3ch tomobil f lwe9t<span style="color: #EC7A45">|</span></span>
</div>

<div style="margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
<span style="font-size: 13px; color: #F4F5F5">BIBIP répond à voix haute</span>
<button role="switch" aria-checked="true" aria-label="Réponse à voix haute" style="width: 48px; height: 28px; border-radius: 14px; border: none; background: #4CC38A; padding: 3px; display: flex; justify-content: flex-end">
<span style="width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF"></span>
</button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 12px">
<a href="Conversation.dc.html" aria-label="Annuler" style="width: 56px; height: 56px; border-radius: 28px; background: #2A3033; border: 1px solid #40484B; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M6 6l1 14h10l1-14"></path></svg>
</a>
<a href="Conversation.dc.html" aria-label="Envoyer le message vocal" style="width: 76px; height: 76px; border-radius: 38px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#202527" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"></path><path d="M5 12l7-7 7 7"></path></svg>
</a>
<button aria-label="Mettre en pause" style="width: 56px; height: 56px; border-radius: 28px; background: #2A3033; border: 1px solid #40484B; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
</button>
</div>
<span style="font-size: 12px; color: #B4BABC; text-align: center">Parlez en darija ou en français</span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#CA531D","options":["#CA531D","#E46A32","#D4AF6A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const h = [6, 10, 16, 24, 14, 30, 20, 12, 26, 34, 18, 28, 14, 22, 32, 16, 26, 12, 20, 30, 14, 24, 10, 18, 28, 12, 16, 8, 12, 6];
return {
accent: this.props.accent ?? '#CA531D',
wave: h.map((v, i) => ({ style: 'width: 4px; border-radius: 2px; height: ' + v + 'px; background: ' + (i > 8 && i < 22 ? '#EC7A45' : '#5E6466') }))
};
}
}
</script>
</body>
</html>
