<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Photos du véhicule</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF;text-decoration:none}a:hover{color:#EC7A45}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 1120px; background: #161A1B; font-family: 'Inter', sans-serif; color: #FFFFFF; position: relative; overflow: hidden; box-sizing: border-box">

<div style="padding: 58px 20px 0 20px; display: flex; align-items: center; justify-content: space-between">
<a href="Main.dc.html" aria-label="Retour à la fiche" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #40484B; background: #202527; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<span style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 700">Photos</span>
<span style="font-size: 11px; color: #B4BABC">{{countLabel}}</span>
</span>
<a href="Main.dc.html" style="height: 44px; border-radius: 22px; background: #CA531D; padding: 0 16px; display: flex; align-items: center; font-size: 13px; font-weight: 600; box-shadow: 0 6px 16px rgba(202,83,29,0.4)">OK</a>
</div>

<div style="margin: 20px 20px 0 20px; position: relative; height: 250px; border-radius: 24px; overflow: hidden; background: #202527; border: 1px solid #343B3E">
<sc-if value="{{selFilled}}" hint-placeholder-val="{{true}}">
<img src="/_blob/5978d6c445805888695e2c04dd814157" alt="{{selAlt}}" style="width: 100%; height: 250px; object-fit: cover; display: block">
</sc-if>
<sc-if value="{{selEmpty}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px">
<svg width="120" height="60" viewBox="0 0 34 22" fill="none" stroke="#5E6466" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{selIcon}}"></path></svg>
<span style="font-size: 13px; color: #B4BABC">Pas encore de photo « {{selLabel}} »</span>
</span>
</sc-if>
<span style="position: absolute; left: 12px; top: 12px; display: flex; gap: 6px">
<span style="font-size: 11px; font-weight: 700; color: #FFFFFF; background: rgba(32,37,39,0.85); border-radius: 8px; padding: 4px 9px">{{selLabel}}</span>
<sc-if value="{{selIsMain}}" hint-placeholder-val="{{true}}">
<span style="font-size: 11px; font-weight: 700; color: #202527; background: #F2C94C; border-radius: 8px; padding: 4px 9px">PRINCIPALE</span>
</sc-if>
</span>
</div>

<div style="margin: 12px 20px 0 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-if value="{{selFilled}}" hint-placeholder-val="{{true}}">
<button onClick="{{makeMain}}" aria-disabled="{{mainDisabled}}" style="{{mainBtn}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg>
{{mainText}}
</button>
<button style="height: 64px; border-radius: 16px; border: 1px solid #40484B; background: #202527; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"></path></svg>
Remplacer
</button>
<button onClick="{{remove}}" style="height: 64px; border-radius: 16px; border: 1px solid #5A2A33; background: #2A1E21; color: #F0657F; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F0657F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>
Supprimer
</button>
</sc-if>
<sc-if value="{{selEmpty}}" hint-placeholder-val="{{false}}">
<button onClick="{{fill}}" style="grid-column: 1 / 3; height: 64px; border-radius: 16px; border: none; background: #CA531D; color: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 20px rgba(202,83,29,0.4)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
Prendre la photo
</button>
<button onClick="{{fill}}" style="height: 64px; border-radius: 16px; border: 1px solid #40484B; background: #202527; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-8 9"></path></svg>
Galerie
</button>
</sc-if>
</div>

<div style="padding: 24px 20px 0 20px; display: flex; flex-direction: column; gap: 12px">
<span style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.16em; color: #B4BABC">LES 6 ANGLES CONSEILLÉS</span>
<span style="font-size: 11px; color: #B4BABC">Maintenir pour déplacer</span>
</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{slots}}" as="s" hint-placeholder-count="6">
<button onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" aria-label="{{s.aria}}" style="{{s.style}}">
<sc-if value="{{s.filled}}" hint-placeholder-val="{{false}}">
<img src="/_blob/5978d6c445805888695e2c04dd814157" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
</sc-if>
<sc-if value="{{s.empty}}" hint-placeholder-val="{{true}}">
<svg width="44" height="28" viewBox="0 0 34 22" fill="none" stroke="#8A9193" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.icon}}"></path></svg>
</sc-if>
<sc-if value="{{s.isMain}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; right: 6px; top: 6px; width: 22px; height: 22px; border-radius: 11px; background: #F2C94C; display: flex; align-items: center; justify-content: center">
<svg width="12" height="12" viewBox="0 0 24 24" fill="#202527" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg>
</span>
</sc-if>
<span style="{{s.labelStyle}}">{{s.label}}</span>
</button>
</sc-for>
</div>

<button style="height: 52px; border-radius: 26px; border: 1.5px dashed #4A5154; background: transparent; color: #F4F5F5; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4F5F5" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
Autre photo (dommage, détail…)
</button>

<span style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 16px; background: #202527; border: 1px solid #343B3E; font-size: 12px; line-height: 1.45; color: #B4BABC">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2C94C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg>
<span>La photo <b style="color: #FFFFFF">principale</b> s'affiche partout : Ma flotte, la galerie, les locations et l'accueil.</span>
</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { sel: 0, main: 0, filled: [true, false, true, false, false, false] };
}
renderVals() {
const st = this.state;
const defs = [
['Avant', 'M4 18V9l5-5h16l5 5v9M4 14h26M10 18v2M24 18v2'],
['Arrière', 'M4 18V9l5-5h16l5 5v9M8 12h4M22 12h4M4 15h26'],
['Côté gauche', 'M2 16v-4l6-6h14l6 6h4v4M9 16a2 2 0 1 0 0 .1M25 16a2 2 0 1 0 0 .1'],
['Côté droit', 'M32 16v-4l-6-6H12l-6 6H2v4M25 16a2 2 0 1 0 0 .1M9 16a2 2 0 1 0 0 .1'],
['Intérieur', 'M8 20V8a4 4 0 0 1 8 0v12M16 14h10M26 14v6'],
['Coffre', 'M3 8h28v12H3zM3 12h28M15 8V5h4v3']
];
const slots = defs.map(([label, icon], i) => {
const filled = st.filled[i];
const on = st.sel === i;
return {
label, icon, filled, empty: !filled,
isMain: filled && st.main === i,
pressed: on ? 'true' : 'false',
aria: label + (filled ? (st.main === i ? ', photo principale' : ', photo ajoutée') : ', à prendre'),
pick: () => this.setState({ sel: i }),
style: 'position: relative; height: 96px; border-radius: 16px; overflow: hidden; padding: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box; background: ' + (filled ? '#202527' : '#1D2122') + '; border: ' + (on ? '2.5px solid #CA531D' : filled ? '1px solid #343B3E' : '1.5px dashed #4A5154') + (on ? '; box-shadow: 0 0 0 3px rgba(202,83,29,0.25)' : ''),
labelStyle: 'position: absolute; left: 6px; bottom: 6px; font-size: 10px; font-weight: 700; border-radius: 6px; padding: 2px 6px; ' + (filled ? 'color: #FFFFFF; background: rgba(32,37,39,0.85);' : 'color: #B4BABC; background: transparent;')
};
});
const sel = st.sel;
const selFilled = st.filled[sel];
const n = st.filled.filter(Boolean).length;
const isMain = selFilled && st.main === sel;
return {
slots,
countLabel: n + (n > 1 ? ' photos' : ' photo') + ' sur 6 angles',
selFilled, selEmpty: !selFilled,
selLabel: defs[sel][0], selIcon: defs[sel][1],
selAlt: 'Photo ' + defs[sel][0].toLowerCase() + ' de la Dacia Logan',
selIsMain: isMain,
mainText: isMain ? 'Principale' : 'Mettre en principale',
mainDisabled: isMain ? 'true' : 'false',
mainBtn: 'height: 64px; border-radius: 16px; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0; ' + (isMain ? 'background: #3A3220; border: 1px solid #F2C94C; color: #F2C94C;' : 'background: #202527; border: 1px solid #40484B; color: #FFFFFF;'),
makeMain: () => this.setState({ main: sel }),
remove: () => {
const f = st.filled.slice(); f[sel] = false;
let main = st.main;
if (main === sel) { const k = f.indexOf(true); main = k < 0 ? 0 : k; }
this.setState({ filled: f, main });
},
fill: () => { const f = st.filled.slice(); f[sel] = true; this.setState({ filled: f }); }
};
}
}
</script>
</body>
</html>
