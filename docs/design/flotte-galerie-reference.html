<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ma Flotte galerie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#202527;text-decoration:none}a:hover{color:#CA531D}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 1000px; background: #FFFFFF; font-family: 'Inter', sans-serif; color: #202527; position: relative; overflow: hidden; box-sizing: border-box">

<div style="background: #202527; padding: 58px 20px 20px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.16em; color: #B4BABC">5 VÉHICULES</span>
<span style="font-family: 'Montserrat', sans-serif; font-size: 28px; font-weight: 700; color: #FFFFFF">Ma flotte</span>
</div>
<div style="display: flex; gap: 10px">
<a href="Main.dc.html" aria-label="Afficher en liste" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #40484B; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><circle cx="4" cy="6" r="1"></circle><circle cx="4" cy="12" r="1"></circle><circle cx="4" cy="18" r="1"></circle></svg>
</a>
<button aria-label="Ajouter un véhicule" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #40484B; background: #2A3033; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
</button>
</div>
</div>
<div style="display: flex; gap: 8px; overflow: hidden; margin-right: -20px">
<span style="flex-shrink: 0; height: 36px; border-radius: 18px; padding: 0 14px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; background: #FFFFFF; color: #202527">Tous <span style="font-size: 11px; border-radius: 9px; padding: 1px 7px; background: #CA531D; color: #FFFFFF">5</span></span>
<span style="flex-shrink: 0; height: 36px; border-radius: 18px; padding: 0 14px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; border: 1px solid #40484B; color: #F4F5F5">Disponibles <span style="font-size: 11px; border-radius: 9px; padding: 1px 7px; background: #343B3E; color: #F4F5F5">2</span></span>
<span style="flex-shrink: 0; height: 36px; border-radius: 18px; padding: 0 14px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; border: 1px solid #40484B; color: #F4F5F5">En location <span style="font-size: 11px; border-radius: 9px; padding: 1px 7px; background: #343B3E; color: #F4F5F5">1</span></span>
<span style="flex-shrink: 0; height: 36px; border-radius: 18px; padding: 0 14px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; border: 1px solid #40484B; color: #F4F5F5">À inspecter <span style="font-size: 11px; border-radius: 9px; padding: 1px 7px; background: #343B3E; color: #F4F5F5">2</span></span>
</div>
</div>

<div style="padding: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{cars}}" as="c" hint-placeholder-count="5">
<a href="#" style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
<span style="position: relative; height: 118px; border-radius: 18px; overflow: hidden; background: #2A3033">
<img src="{{c.img}}" alt="{{c.alt}}" style="width: 100%; height: 118px; object-fit: cover; display: block">
<span style="position: absolute; left: 8px; top: 8px; display: flex; align-items: center; gap: 5px; background: rgba(32,37,39,0.88); border-radius: 8px; padding: 4px 8px; font-size: 11px; font-weight: 600; color: #FFFFFF"><span style="{{c.dot}}"></span>{{c.status}}</span>
</span>
<span style="display: flex; flex-direction: column; gap: 5px; padding: 0 2px">
<span style="font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</span>
<span style="display: flex; justify-content: space-between; align-items: center; gap: 6px">
<span style="font-size: 10px; font-weight: 600; letter-spacing: 0.04em; border: 1.5px solid #202527; border-radius: 5px; padding: 1px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0">{{c.plate}}</span>
<span style="font-size: 13px; font-weight: 700; flex-shrink: 0">{{c.price}}<span style="font-size: 10px; font-weight: 500; color: #5E6466"> /j</span></span>
</span>
</span>
</a>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const DEF = '/_blob/b93ff4357a87bf918b957270b01b0847';
const PHOTO = '/_blob/4fbd9ba9c887d5ee000f35dc1343bfda';
const dots = { free: '#4CC38A', rent: '#F4F5F5', insp: '#E0B000' };
const labels = { free: 'Disponible', rent: 'En location', insp: 'À inspecter' };
const fleet = [
{ name: 'Dacia Logan', plate: '8921 | ب | 14', st: 'insp', price: '500', img: PHOTO },
{ name: '[Véhicule 5]', plate: '[Immat.]', st: 'insp', price: '[Prix]', img: DEF },
{ name: 'Dacia Sandero', plate: '68013 | ب | 72', st: 'rent', price: '500', img: DEF },
{ name: 'Troc 2025', plate: '[Immat.]', st: 'free', price: '[Prix]', img: DEF },
{ name: 'F1 F1', plate: '[Immat.]', st: 'free', price: '[Prix]', img: DEF }
];
return {
cars: fleet.map((v) => ({
name: v.name,
plate: v.plate,
price: v.price,
img: v.img,
alt: v.img === DEF ? 'Image par défaut, aucune photo' : 'Photo de la ' + v.name,
status: labels[v.st],
dot: 'width: 7px; height: 7px; border-radius: 4px; background: ' + dots[v.st]
}))
};
}
}
</script>
</body>
</html>
